services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: app-php
    volumes:
      - ./src:/var/www/html
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:latest
    container_name: app-nginx
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: app-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: app-redis
    ports:
      - "6379:6379"

  node:
    image: node:20
    container_name: app-node
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    entrypoint: ["tail", "-f", "/dev/null"] # tetap hidup untuk exec

volumes:
  mysql_data:
