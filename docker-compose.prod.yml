services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: app-php-prod

  nginx:
    image: nginx:latest
    container_name: app-nginx-prod
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf
      - ./src:/var/www/html:ro
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: app-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data_prod:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: app-redis-prod

volumes:
  mysql_data_prod:
